# TESS dataset configuration
dataset:
  name: tess
  # Place dataset here: emotionai/data/tess/
  # Expected layout: data/tess/OAF_angry/*.wav, data/tess/YAF_happy/*.wav, etc.
  # Download from: https://tspace.library.utoronto.ca/handle/1807/24487
  directory: data/tess

preprocessing:
  sample_rate: 22050
  n_mfcc: 40
  n_fft: 2048
  hop_length: 512
  max_time_steps: 216
  use_delta: true
  use_delta2: true
  min_duration: 0.5
  max_duration: 10.0
  silence_threshold_db: -60.0

model:
  type: cnn_bilstm
  cnn_channels: [64, 128]
  lstm_hidden: 256
  lstm_layers: 2
  dropout: 0.3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 7
  random_seed: 42
  validation_split: 0.15
  test_split: 0.15
  speaker_independent: true

output:
  artifacts_dir: artifacts/
  reports_dir: reports/
  checkpoint: artifacts/best_model.pt
  evaluation_results: reports/evaluation_results.json
